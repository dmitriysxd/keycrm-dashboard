# Внутрішньоденна досинхронізація заказів (кожні 2 години).
#
# Повний цикл тягне заказы раз на добу (Vercel cron 03:00 UTC). Нові денні
# заказы інакше зʼявлялись би в дашборді лише наступної ночі. Цей воркфлоу
# кожні 2 год дотягує свіжі заказы (created/updated за 3 дні) у sales +
# освіжає матвʼюшки — дашборди стають актуальними протягом дня.

name: Intraday orders sync

on:
  schedule:
    # Кожні 2 години, хвилина :23 (щоб не в пік початку години).
    - cron: "23 */2 * * *"
  workflow_dispatch:

jobs:
  recent:
    runs-on: ubuntu-latest
    steps:
      - name: Sync recent orders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET не налаштовано"; exit 1; fi
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" --max-time 90 \
            "https://keycrm-dashboard.vercel.app/api/cron/ingest?step=recent_orders&secret=$CRON_SECRET")
          echo "HTTP $HTTP"; cat /tmp/resp.json | head -c 500; echo ""
          # 200 — успіх; інше не валимо жорстко (наступний запуск через 2 год).
          if [ "$HTTP" != "200" ]; then echo "::warning::HTTP $HTTP"; fi
